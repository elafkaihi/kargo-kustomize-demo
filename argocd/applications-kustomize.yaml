# One Argo CD Application per environment of the kargo-kustomize project.
# Each reads its own branch (env/kz-<stage>), written only by Kargo promotions.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kz-dev
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-kustomize:dev
spec:
  project: default
  source:
    repoURL: https://github.com/elafkaihi/kargo-kustomize-demo.git
    targetRevision: env/kz-dev
    path: gitops-kustomize/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: kz-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
