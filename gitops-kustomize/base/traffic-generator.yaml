# Steady synthetic traffic (~10 req/s) so verification queries never see an
# empty rate() (no traffic = NaN success rate).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      labels:
        app: traffic-generator
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                curl -s -o /dev/null --max-time 2 http://podinfo:9898/
                curl -s -o /dev/null --max-time 2 http://podinfo:9898/api/info
                sleep 0.2
              done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
